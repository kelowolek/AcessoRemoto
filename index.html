<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Remoto FOCOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        h1 { font-size: 20px; color: #38bdf8; margin-bottom: 15px; }

        .login-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }
        input[type="text"], input[type="password"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-green { background-color: #10b981; }
        
        .video-container {
            position: relative;
            width: 100%;
            max-height: 80vh;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        .click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }
        .status { margin-top: 12px; font-size: 13px; color: #94a3b8; }
        #hidden-keyboard-input { position: absolute; opacity: 0; top: -1000px; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
    <h1>Acesso Remoto FOCOS</h1>

    <!-- TELA DE LOGIN -->
    <div id="login-section" class="login-box">
        <input type="text" id="web-user" placeholder="Usuário">
        <input type="password" id="web-pass" placeholder="Senha da Página">
        <hr style="border: 0; border-top: 1px solid #334155; margin: 5px 0;">
        <input type="text" id="host-id" placeholder="ID Fixo do Computador">
        <input type="password" id="host-pass" placeholder="Senha do Computador">
        <button class="btn" onclick="autenticarEConectar()">Conectar como Cliente</button>
        <button class="btn btn-green" onclick="iniciarHost()">Transmitir como Host</button>
    </div>

    <!-- TELA DE TRANSMISSÃO -->
    <div id="remote-section" style="display: none;">
        <div class="video-container">
            <video id="video-player" autoplay playsinline muted></video>
            <div id="click-overlay" class="click-overlay"></div>
        </div>
    </div>

    <input type="text" id="hidden-keyboard-input" autocomplete="off">
    <div id="status" class="status">Digite os dados para acessar...</div>
</div>

<script>
    let peer = null;
    let localWs = null;
    let activeStream = null;
    const statusElement = document.getElementById('status');
    const videoElement = document.getElementById('video-player');
    const clickOverlay = document.getElementById('click-overlay');

    function validarLoginWeb() {
        const webUser = document.getElementById('web-user').value.trim();
        const webPass = document.getElementById('web-pass').value.trim();
        if (webUser !== 'FOCOS' || webPass !== '@Focos5040') {
            alert('Usuário ou Senha do sistema incorretos!');
            return false;
        }
        return true;
    }

    // MODO HOST (Quem compartilha a tela)
    async function iniciarHost() {
        if (!validarLoginWeb()) return;
        const hostId = document.getElementById('host-id').value.trim();
        const hostPass = document.getElementById('host-pass').value.trim();

        if (!hostId || !hostPass) {
            alert('Informe o ID e a Senha para criar o Host!');
            return;
        }

        try {
            activeStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            videoElement.srcObject = activeStream;

            // Conecta no WebSocket local rodando pelo app.js
            try {
                localWs = new WebSocket('ws://localhost:8080');
            } catch(e){}

            peer = new Peer(hostId);

            peer.on('open', () => {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('remote-section').style.display = 'block';
                statusElement.innerText = `🟢 Host Ativo! Aguardando conexões para o ID: ${hostId}`;
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'AUTH_HOST') {
                        if (data.password === hostPass) {
                            conn.send({ type: 'AUTH_OK' });
                            peer.call(conn.peer, activeStream);
                            statusElement.innerText = "✅ Cliente conectado e autorizado!";
                        } else {
                            conn.send({ type: 'AUTH_FAIL' });
                        }
                    } else if (localWs && localWs.readyState === WebSocket.OPEN) {
                        // Repassa os comandos de mouse/teclado para o app.js local
                        localWs.send(JSON.stringify(data));
                    }
                });
            });

            peer.on('error', (err) => {
                alert("Erro ao criar ID de Host (pode ser que já esteja em uso).");
            });

        } catch (e) {
            alert("Seleção de tela cancelada.");
        }
    }

    // MODO CLIENTE (Quem controla)
    function autenticarEConectar() {
        if (!validarLoginWeb()) return;
        const hostId = document.getElementById('host-id').value.trim();
        const hostPass = document.getElementById('host-pass').value.trim();

        if (!hostId || !hostPass) {
            alert('Informe o ID e a Senha do computador remoto!');
            return;
        }

        statusElement.innerText = "Conectando ao computador remoto...";
        
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);

            conn.on('open', () => {
                conn.send({ type: 'AUTH_HOST', password: hostPass });
            });

            conn.on('data', (data) => {
                if (data.type === 'AUTH_OK') {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('remote-section').style.display = 'block';
                    statusElement.innerText = "Acesso autorizado! Transmissão em andamento.";
                    setupControls(conn);
                } else if (data.type === 'AUTH_FAIL') {
                    alert('Senha do computador remoto está incorreta!');
                    location.reload();
                }
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.play();
                });
            });
        });
    }

    function setupControls(conn) {
        clickOverlay.addEventListener('click', (e) => {
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left' });
        });

        clickOverlay.addEventListener('mousemove', (e) => {
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_MOVE', x: pos.x, y: pos.y });
        });

        clickOverlay.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'right' });
        });

        window.addEventListener('keydown', (e) => {
            conn.send({ type: 'KEY_PRESS', key: e.key, ctrlKey: e.ctrlKey, altKey: e.altKey, shiftKey: e.shiftKey });
        });
    }

    function getScaledCoordinates(e) {
        const rect = videoElement.getBoundingClientRect();
        const scaleX = videoElement.videoWidth / rect.width;
        const scaleY = videoElement.videoHeight / rect.height;
        return {
            x: Math.round((e.clientX - rect.left) * scaleX),
            y: Math.round((e.clientY - rect.top) * scaleY)
        };
    }
</script>

</body>
</html>
