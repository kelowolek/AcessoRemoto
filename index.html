<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Remoto Completo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1000px;
            text-align: center;
            position: relative;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        h1 { font-size: 20px; color: #38bdf8; text-align: left; }

        .viewer-badge {
            background-color: #0284c7;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-off { background-color: #64748b !important; }
        .btn-green { background-color: #10b981; }
        .btn-whatsapp { background-color: #25d366; }

        .video-container {
            position: relative;
            width: 100%;
            max-height: 520px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
            object-fit: contain;
        }
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
        }

        /* CURSOR VISUAL APENAS PARA SEGUIR MOVIMENTO */
        .remote-cursor {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 20;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        #hidden-keyboard-input {
            position: absolute;
            opacity: 0;
            top: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
        }

        .share-container {
            margin-top: 12px;
            display: none;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
        }
        .share-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="tel"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 13px;
        }
        #share-link { width: 55%; }
        #phone-number { width: 180px; }
        .status { margin-top: 10px; font-size: 12px; color: #94a3b8; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
    <div class="header-container">
        <h1 id="title">Painel de Acesso Remoto</h1>
        <div class="viewer-badge" id="viewer-badge" style="display: none;">
            <span class="live-dot"></span>
            <span id="viewer-count">0 conexões</span>
        </div>
    </div>

    <div id="viewer-controls" class="toolbar" style="display: none;">
        <button id="toggle-mouse-btn" class="btn" onclick="toggleMouseControl()">🖱️ Mouse: ATIVO</button>
        <button id="toggle-audio-btn" class="btn" onclick="toggleAudio()">🔊 Áudio: ATIVO</button>
        <button id="open-keyboard-btn" class="btn btn-green" onclick="focusKeyboard()">⌨️ Abrir Teclado</button>
    </div>

    <div id="host-controls">
        <button id="start-btn" class="btn btn-green" onclick="startBroadcasting()">🚀 Transmitir Minha Tela</button>
    </div>

    <div id="share-container" class="share-container">
        <div class="share-row">
            <input type="text" id="share-link" readonly>
            <button class="btn" onclick="copyLink()">Copiar Link</button>
        </div>
        <div class="share-row">
            <input type="tel" id="phone-number" placeholder="DDD + Número">
            <button class="btn btn-whatsapp" onclick="sendWhatsApp()">💬 WhatsApp</button>
        </div>
    </div>

    <div class="video-container" id="video-box">
        <video id="video-player" autoplay playsinline muted></video>
        <div id="click-overlay" class="click-overlay" style="display: none;"></div>
        <div id="remote-cursor" class="remote-cursor"></div>
    </div>

    <input type="text" id="hidden-keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">

    <div id="status" class="status">Aguardando ação...</div>
</div>

<script>
    let peer = null;
    let combinedStream = null;
    let activeConnections = [];
    let localWs = null;
    let activeConn = null;

    let isMouseEnabled = true;
    let isAudioEnabled = true;

    const videoElement = document.getElementById('video-player');
    const clickOverlay = document.getElementById('click-overlay');
    const remoteCursor = document.getElementById('remote-cursor');
    const hiddenInput = document.getElementById('hidden-keyboard-input');
    const statusElement = document.getElementById('status');
    const shareContainer = document.getElementById('share-container');
    const shareInput = document.getElementById('share-link');
    const hostControls = document.getElementById('host-controls');
    const viewerControls = document.getElementById('viewer-controls');
    const viewerBadge = document.getElementById('viewer-badge');
    const viewerCountElement = document.getElementById('viewer-count');

    const urlParams = new URLSearchParams(window.location.search);
    const streamIdParam = urlParams.get('stream');

    if (streamIdParam) {
        hostControls.style.display = 'none';
        viewerControls.style.display = 'flex';
        viewerBadge.style.display = 'inline-flex';
        clickOverlay.style.display = 'block';
        document.getElementById('title').innerText = "Sessão Remota Ativa";
        statusElement.innerText = "Conectando ao computador remoto...";
        connectToStream(streamIdParam);
    } else {
        connectLocalWebSocket();
    }

    function connectLocalWebSocket() {
        try {
            localWs = new WebSocket('ws://localhost:8080');
            localWs.onopen = () => {
                statusElement.innerText = "Pronto para transmitir (Programa local conectado).";
            };
            localWs.onerror = () => {
                statusElement.innerText = "Aviso: Programa app.js não detectado no PC.";
            };
        } catch (e) {}
    }

    async function startBroadcasting() {
        try {
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30, max: 60 } },
                audio: true
            });

            combinedStream = new MediaStream();
            displayStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

            if (displayStream.getAudioTracks().length > 0) {
                displayStream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
            }

            videoElement.srcObject = combinedStream;
            videoElement.muted = true;
            videoElement.play();

            peer = new Peer();

            peer.on('open', (id) => {
                const streamUrl = `${window.location.origin}${window.location.pathname}?stream=${id}`;
                shareInput.value = streamUrl;
                shareContainer.style.display = 'block';
                viewerBadge.style.display = 'inline-flex';
                document.getElementById('start-btn').disabled = true;
                updateViewerCount();
            });

            peer.on('connection', (conn) => {
                activeConnections.push(conn);
                peer.call(conn.peer, combinedStream);
                updateViewerCount();

                conn.on('data', (data) => {
                    if (data && localWs && localWs.readyState === WebSocket.OPEN) {
                        localWs.send(JSON.stringify(data));
                    }
                });

                const removeConn = () => {
                    activeConnections = activeConnections.filter(c => c.peer !== conn.peer);
                    updateViewerCount();
                };

                conn.on('close', removeConn);
                conn.on('error', removeConn);
            });

        } catch (err) {
            statusElement.innerText = "Erro ao iniciar captura de tela.";
        }
    }

    function updateViewerCount() {
        const count = activeConnections.length;
        viewerCountElement.innerText = count === 1 ? "1 conexão" : `${count} conexões`;
    }

    function connectToStream(hostId) {
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);
            activeConn = conn;

            conn.on('open', () => {
                statusElement.innerText = "Conectado! Controle o mouse e teclado livremente.";
                setupControls(conn);
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false;
                    
                    // Garante a reprodução para evitar tela preta
                    const playPromise = videoElement.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            videoElement.muted = true;
                            videoElement.play();
                        });
                    }
                });
            });
        });
    }

    function setupControls(conn) {
        // Envia movimento contínuo do mouse tanto no PC quanto no toque do celular
        const sendMove = (e) => {
            if (!isMouseEnabled) return;
            const pos = getScaledCoordinates(e);
            updateCursorPosition(e);
            conn.send({ type: 'MOUSE_MOVE', x: pos.x, y: pos.y });
        };

        clickOverlay.addEventListener('mousemove', sendMove);
        clickOverlay.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) sendMove(e.touches[0]);
        });

        // Clique Esquerdo
        clickOverlay.addEventListener('click', (e) => {
            if (!isMouseEnabled) return;
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left' });
        });

        // Clique Direito
        clickOverlay.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (!isMouseEnabled) return;
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'right' });
        });

        // Captura do Teclado Físico
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.id !== 'hidden-keyboard-input') return;
            conn.send({ type: 'KEY_PRESS', key: e.key });
        });

        // Captura de Teclado no Celular através do Input Invisível
        hiddenInput.addEventListener('keydown', (e) => {
            conn.send({ type: 'KEY_PRESS', key: e.key });
        });
    }

    function getScaledCoordinates(event) {
        const rect = clickOverlay.getBoundingClientRect();
        const scaleX = videoElement.videoWidth / rect.width;
        const scaleY = videoElement.videoHeight / rect.height;

        return {
            x: Math.round((event.clientX - rect.left) * scaleX),
            y: Math.round((event.clientY - rect.top) * scaleY)
        };
    }

    function updateCursorPosition(event) {
        const rect = clickOverlay.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        remoteCursor.style.left = `${x}px`;
        remoteCursor.style.top = `${y}px`;
        remoteCursor.style.display = 'block';
    }

    function toggleMouseControl() {
        isMouseEnabled = !isMouseEnabled;
        const btn = document.getElementById('toggle-mouse-btn');
        if (isMouseEnabled) {
            btn.classList.remove('btn-off');
            btn.innerText = "🖱️ Mouse: ATIVO";
            clickOverlay.style.cursor = 'crosshair';
        } else {
            btn.classList.add('btn-off');
            btn.innerText = "🖱️ Mouse: DESATIVADO";
            remoteCursor.style.display = 'none';
            clickOverlay.style.cursor = 'default';
        }
    }

    function toggleAudio() {
        isAudioEnabled = !isAudioEnabled;
        videoElement.muted = !isAudioEnabled;
        const btn = document.getElementById('toggle-audio-btn');
        if (isAudioEnabled) {
            btn.classList.remove('btn-off');
            btn.innerText = "🔊 Áudio: ATIVO";
        } else {
            btn.classList.add('btn-off');
            btn.innerText = "🔇 Áudio: MUTADO";
        }
    }

    function focusKeyboard() {
        hiddenInput.focus();
        statusElement.innerText = "Teclado ativo! Pode digitar.";
    }

    function copyLink() {
        shareInput.select();
        document.execCommand('copy');
        alert("Link copiado!");
    }

    function sendWhatsApp() {
        const phone = document.getElementById('phone-number').value.replace(/\D/g, '');
        const url = shareInput.value;
        if (!url) return alert("Inicie a transmissão primeiro!");
        const msg = encodeURIComponent(`Link de acesso remoto: ${url}`);
        window.open(phone ? `https://api.whatsapp.com/send?phone=55${phone}&text=${msg}` : `https://api.whatsapp.com/send?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
