<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Remoto FOCOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1000px;
            text-align: center;
            position: relative;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        h1 { font-size: 18px; color: #38bdf8; text-align: left; }

        .login-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 320px;
            margin: 20px auto;
        }
        input[type="text"], input[type="password"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-mode-direct { background-color: #eab308 !important; color: #000 !important; }
        .btn-off { background-color: #64748b !important; }
        .btn-green { background-color: #10b981; }

        .video-container {
            position: relative;
            width: 100%;
            max-height: 80vh;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fullscreen-active {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            max-height: 100vh !important; z-index: 9999 !important;
            border-radius: 0 !important; background-color: #000 !important;
        }
        video { width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; }
        .click-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        #hidden-keyboard-input { position: absolute; opacity: 0; top: -1000px; left: -1000px; }
        .status { margin-top: 10px; font-size: 12px; color: #94a3b8; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card" id="main-card">
    <div class="header-container" id="header-box">
        <h1 id="title">Acesso Remoto FOCOS</h1>
    </div>

    <!-- TELA DE LOGIN DO CLIENTE -->
    <div id="login-section" class="login-box">
        <input type="text" id="web-user" placeholder="Usuário">
        <input type="password" id="web-pass" placeholder="Senha do Sistema">
        <hr style="border: 0; border-top: 1px solid #334155; margin: 5px 0;">
        <input type="text" id="host-id" placeholder="ID do Computador">
        <input type="password" id="host-pass" placeholder="Senha do Computador">
        <button class="btn btn-green" onclick="autenticarEConectar()">🚀 Acessar Computador</button>
    </div>

    <!-- PAINEL DE CONTROLES DO CLIENTE -->
    <div id="viewer-controls" class="toolbar" style="display: none;">
        <button id="toggle-mouse-btn" class="btn" onclick="toggleMouseControl()">🖱️ Modo: MOVIMENTO</button>
        <button id="toggle-audio-btn" class="btn btn-off" onclick="toggleAudio()">🔇 Áudio: MUTADO</button>
        <button id="open-keyboard-btn" class="btn btn-green" onclick="focusKeyboard()">⌨️ Teclado</button>
        <button id="fullscreen-btn" class="btn" onclick="toggleFullscreen()">🖥️ Tela Cheia</button>
    </div>

    <!-- MODO HOST (INICIAR TRANSMISSÃO) -->
    <div id="host-controls" style="display: none; margin-bottom: 12px;">
        <button id="start-btn" class="btn btn-green" onclick="iniciarHost()">🚀 Iniciar Transmissão da Tela</button>
    </div>

    <!-- CONTÊINER DE VÍDEO -->
    <div class="video-container" id="video-box" style="display: none;">
        <video id="video-player" autoplay playsinline muted></video>
        <div id="click-overlay" class="click-overlay"></div>
    </div>

    <input type="text" id="hidden-keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div id="status" class="status">Aguardando login...</div>
</div>

<script>
    let peer = null;
    let localWs = null;
    let isContinuousMouse = true;
    let isAudioEnabled = false;
    let isFullscreen = false;

    const videoElement = document.getElementById('video-player');
    const videoBox = document.getElementById('video-box');
    const clickOverlay = document.getElementById('click-overlay');
    const hiddenInput = document.getElementById('hidden-keyboard-input');
    const statusElement = document.getElementById('status');

    const urlParams = new URLSearchParams(window.location.search);
    const hostParam = urlParams.get('host');
    const passParam = urlParams.get('pass');

    // Se for aberto pelo app.js local para transmitir
    if (hostParam) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('host-controls').style.display = 'block';
        statusElement.innerText = `Pronto para transmitir o ID: ${hostParam}. Clique no botão acima.`;
    }

    // MODO HOST
    async function iniciarHost() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            videoElement.srcObject = stream;
            videoBox.style.display = 'flex';

            try { localWs = new WebSocket('ws://localhost:8080'); } catch (e) {}

            peer = new Peer(hostParam);

            peer.on('open', () => {
                document.getElementById('start-btn').disabled = true;
                statusElement.innerText = `🟢 Host no ar! Aguardando o cliente conectar no ID: ${hostParam}`;
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'AUTH_HOST') {
                        if (data.password === passParam) {
                            conn.send({ type: 'AUTH_OK' });
                            peer.call(conn.peer, stream);
                            statusElement.innerText = "✅ Cliente conectado e autorizado!";
                        } else {
                            conn.send({ type: 'AUTH_FAIL' });
                        }
                    } else if (localWs && localWs.readyState === WebSocket.OPEN) {
                        localWs.send(JSON.stringify(data));
                    }
                });
            });
        } catch (e) {
            statusElement.innerText = "Seleção de tela cancelada.";
        }
    }

    // MODO CLIENTE
    function autenticarEConectar() {
        const webUser = document.getElementById('web-user').value.trim();
        const webPass = document.getElementById('web-pass').value.trim();
        const hostId = document.getElementById('host-id').value.trim();
        const hostPass = document.getElementById('host-pass').value.trim();

        if (webUser !== 'FOCOS' || webPass !== '@Focos5040') {
            alert('Usuário ou Senha do sistema incorretos!');
            return;
        }

        if (!hostId || !hostPass) {
            alert('Preencha o ID e a Senha do Computador!');
            return;
        }

        statusElement.innerText = "Conectando ao host...";
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);

            conn.on('open', () => {
                conn.send({ type: 'AUTH_HOST', password: hostPass });
            });

            conn.on('data', (data) => {
                if (data.type === 'AUTH_OK') {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('viewer-controls').style.display = 'flex';
                    videoBox.style.display = 'flex';
                    statusElement.innerText = "Acesso autorizado! Transmissão em andamento.";
                    setupControls(conn);
                } else if (data.type === 'AUTH_FAIL') {
                    alert('Senha do computador incorreta!');
                    location.reload();
                }
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.play();
                });
            });
        });
    }

    function setupControls(conn) {
        clickOverlay.addEventListener('click', (e) => {
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left' });
        });

        clickOverlay.addEventListener('mousemove', (e) => {
            if (!isContinuousMouse) return;
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_MOVE', x: pos.x, y: pos.y });
        });

        clickOverlay.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'right' });
        });

        hiddenInput.addEventListener('input', (e) => {
            if (e.data) conn.send({ type: 'TEXT_INPUT', text: e.data });
            hiddenInput.value = '';
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.id !== 'hidden-keyboard-input') return;
            conn.send({
                type: 'KEY_PRESS',
                key: e.key,
                ctrlKey: e.ctrlKey,
                altKey: e.altKey,
                shiftKey: e.shiftKey,
                metaKey: e.metaKey
            });
        });
    }

    function getScaledCoordinates(e) {
        const rect = videoElement.getBoundingClientRect();
        const scaleX = videoElement.videoWidth / rect.width;
        const scaleY = videoElement.videoHeight / rect.height;
        return {
            x: Math.round((e.clientX - rect.left) * scaleX),
            y: Math.round((e.clientY - rect.top) * scaleY)
        };
    }

    function toggleMouseControl() {
        isContinuousMouse = !isContinuousMouse;
        const mainBtn = document.getElementById('toggle-mouse-btn');
        mainBtn.innerText = isContinuousMouse ? "🖱️ Modo: MOVIMENTO" : "👆 Modo: TOQUE DIRETO";
        mainBtn.classList.toggle('btn-mode-direct', !isContinuousMouse);
    }

    function toggleFullscreen() {
        isFullscreen = !isFullscreen;
        videoBox.classList.toggle('fullscreen-active', isFullscreen);
    }

    function toggleAudio() {
        isAudioEnabled = !isAudioEnabled;
        videoElement.muted = !isAudioEnabled;
        const btn = document.getElementById('toggle-audio-btn');
        btn.innerText = isAudioEnabled ? "🔊 Áudio: ATIVO" : "🔇 Áudio: MUTADO";
        btn.classList.toggle('btn-off', !isAudioEnabled);
    }

    function focusKeyboard() {
        hiddenInput.focus();
        statusElement.innerText = "Teclado ativo!";
    }
</script>

</body>
</html>
