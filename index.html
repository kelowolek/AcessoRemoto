<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Remoto Não Supervisionado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }
        .login-box {
            max-width: 380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:hover { background-color: #059669; }
        .screen-container {
            position: relative;
            width: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        #remote-screen {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }
        #status { margin-top: 12px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Acesso Remoto Direto</h2>
    <br>

    <!-- Tela de Login de Dispositivo -->
    <div id="login-box" class="login-box">
        <input type="text" id="ip-address" placeholder="IP do Computador (ex: localhost ou IP)" value="localhost">
        <input type="text" id="device-id" placeholder="ID do Computador" value="escritorio-01">
        <input type="password" id="device-password" placeholder="Senha de Acesso" value="12345678password">
        <button class="btn" onclick="connectToDevice()">Conectar ao PC</button>
    </div>

    <!-- Tela da Transmission -->
    <div id="screen-container" class="screen-container">
        <img id="remote-screen" alt="Tela Remota">
    </div>

    <div id="status">Aguardando dados de conexão...</div>
</div>

<script>
    let ws = null;
    let lastClickTime = 0;
    let singleTapTimer = null;

    const screenImg = document.getElementById('remote-screen');
    const screenContainer = document.getElementById('screen-container');
    const loginBox = document.getElementById('login-box');
    const statusEl = document.getElementById('status');

    function connectToDevice() {
        const ip = document.getElementById('ip-address').value;
        const deviceId = document.getElementById('device-id').value;
        const password = document.getElementById('device-password').value;

        statusEl.innerText = "Conectando ao servidor...";
        ws = new WebSocket(`ws://${ip}:8080`);

        ws.onopen = () => {
            statusEl.innerText = "Autenticando...";
            ws.send(JSON.stringify({ type: 'AUTH', deviceId: deviceId, password: password }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'AUTH_SUCCESS') {
                loginBox.style.display = 'none';
                screenContainer.style.display = 'flex';
                statusEl.innerText = "Conectado e Transmitindo em tempo real!";
                setupControls();
            } else if (data.type === 'AUTH_FAILED') {
                statusEl.innerText = "Erro de autenticação: " + data.reason;
            } else if (data.type === 'FRAME') {
                screenImg.src = data.image;
            }
        };

        ws.onerror = () => { statusEl.innerText = "Falha de conexão com o computador remoto."; };
        ws.onclose = () => { statusEl.innerText = "Conexão encerrada."; };
    }

    function setupControls() {
        // Envio do Clique do Mouse com Correção do Duplo Clique
        screenImg.addEventListener('click', (e) => {
            const pos = getScaledCoordinates(e);
            const now = Date.now();

            if (now - lastClickTime < 280) {
                clearTimeout(singleTapTimer);
                ws.send(JSON.stringify({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left', double: true }));
                lastClickTime = 0;
            } else {
                lastClickTime = now;
                singleTapTimer = setTimeout(() => {
                    ws.send(JSON.stringify({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left', double: false }));
                    lastClickTime = 0;
                }, 280);
            }
        });

        screenImg.addEventListener('mousemove', (e) => {
            const pos = getScaledCoordinates(e);
            ws.send(JSON.stringify({ type: 'MOUSE_MOVE', x: pos.x, y: pos.y }));
        });

        window.addEventListener('keydown', (e) => {
            ws.send(JSON.stringify({ type: 'KEY_PRESS', key: e.key }));
        });
    }

    function getScaledCoordinates(event) {
        const rect = screenImg.getBoundingClientRect();
        const scaleX = screenImg.naturalWidth / rect.width;
        const scaleY = screenImg.naturalHeight / rect.height;

        return {
            x: Math.round((event.clientX - rect.left) * scaleX),
            y: Math.round((event.clientY - rect.top) * scaleY)
        };
    }
</script>

</body>
</html>
