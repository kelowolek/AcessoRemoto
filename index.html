<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão com Acesso Remoto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; color: #38bdf8; text-align: left; }
        
        .viewer-badge {
            background-color: #0284c7;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .instructions {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Container do Vídeo + Camada do Mouse */
        .video-container {
            position: relative;
            width: 100%;
            max-height: 480px;
            margin-top: 10px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
        }
        /* Capa transparente para capturar cliques de controle */
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 4px;
        }
        .btn-green { background-color: #10b981; }
        .btn-whatsapp { background-color: #25d366; }
        .share-container {
            margin-top: 15px;
            display: none;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 15px;
            border-radius: 8px;
        }
        .share-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="tel"] {
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        #share-link { width: 60%; }
        #phone-number { width: 180px; }
        .status { margin-top: 12px; font-size: 13px; color: #94a3b8; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
    <div class="header-container">
        <h1 id="title">Transmissão de Tela</h1>
        
        <div class="viewer-badge" id="viewer-badge" style="display: none;">
            <span class="live-dot"></span>
            <span id="viewer-count">0 pessoas assistindo</span>
        </div>
    </div>

    <div id="instructions-box" class="instructions">
        💡 <b>Dica essencial para áudio (Google Chrome):</b> Ao clicar em Transmitir, selecione <b>"Guia do Chrome"</b> e marque a opção <i>"Compartilhar áudio da guia"</i>.
    </div>

    <div id="host-controls">
        <button id="start-btn" class="btn" onclick="startBroadcasting()">🚀 Transmitir Minha Tela</button>
    </div>

    <div id="viewer-controls" style="display: none;">
        <button id="unmute-btn" class="btn btn-green" onclick="enableAudio()">🔊 Clique Aqui para Ativar Som</button>
    </div>

    <div id="share-container" class="share-container">
        <div class="share-row">
            <input type="text" id="share-link" readonly>
            <button class="btn" onclick="copyLink()">Copiar Link</button>
        </div>
        
        <div class="share-row" style="margin-top: 12px; border-top: 1px solid #334155; padding-top: 12px;">
            <input type="tel" id="phone-number" placeholder="DDD + Número (ex: 11999998888)">
            <button class="btn btn-whatsapp" onclick="sendWhatsApp()">💬 Enviar no WhatsApp</button>
        </div>
    </div>

    <div class="video-container">
        <video id="video-player" autoplay playsinline></video>
        <!-- Camada transparente de captura de cliques -->
        <div id="click-overlay" class="click-overlay" style="display: none;"></div>
    </div>

    <div id="status" class="status">Aguardando ação...</div>
</div>

<script>
    let peer = null;
    let combinedStream = null;
    let activeConnections = [];
    let localWs = null;

    const videoElement = document.getElementById('video-player');
    const clickOverlay = document.getElementById('click-overlay');
    const statusElement = document.getElementById('status');
    const shareContainer = document.getElementById('share-container');
    const shareInput = document.getElementById('share-link');
    const hostControls = document.getElementById('host-controls');
    const viewerControls = document.getElementById('viewer-controls');
    const instructionsBox = document.getElementById('instructions-box');
    const viewerBadge = document.getElementById('viewer-badge');
    const viewerCountElement = document.getElementById('viewer-count');

    const urlParams = new URLSearchParams(window.location.search);
    const streamIdParam = urlParams.get('stream');

    if (streamIdParam) {
        // MODO ESPECTADOR / CLIENTE
        hostControls.style.display = 'none';
        instructionsBox.style.display = 'none';
        viewerControls.style.display = 'block';
        viewerBadge.style.display = 'inline-flex';
        clickOverlay.style.display = 'block'; // Ativa a camada de captura de cliques
        document.getElementById('title').innerText = "Controle Remoto Ativo";
        statusElement.innerText = "Conectando ao transmissor...";
        connectToStream(streamIdParam);
    } else {
        // MODO TRANSMISSOR
        connectLocalWebSocket();
    }

    function connectLocalWebSocket() {
        try {
            localWs = new WebSocket('ws://localhost:8080');
            localWs.onopen = () => {
                console.log("Conectado ao app.js local do Windows!");
                statusElement.innerText = "Pronto para transmitir (Programa auxiliar conectado no PC).";
            };
            localWs.onerror = () => {
                console.warn("Programa app.js local não detectado.");
            };
        } catch (e) {
            console.warn("WebSocket local indisponível.");
        }
    }

    async function startBroadcasting() {
        try {
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30, max: 60 } },
                audio: true
            });

            combinedStream = new MediaStream();
            displayStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

            if (displayStream.getAudioTracks().length > 0) {
                displayStream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
                statusElement.innerText = "Áudio e vídeo capturados com sucesso!";
            } else {
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micStream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
                    statusElement.innerText = "Usando áudio do microfone/sistema!";
                } catch (micErr) {
                    statusElement.innerText = "AVISO: Transmitindo sem áudio.";
                }
            }

            videoElement.srcObject = combinedStream;
            videoElement.muted = true;

            peer = new Peer();

            peer.on('open', (id) => {
                const streamUrl = `${window.location.origin}${window.location.pathname}?stream=${id}`;
                shareInput.value = streamUrl;
                shareContainer.style.display = 'block';
                viewerBadge.style.display = 'inline-flex';
                document.getElementById('start-btn').disabled = true;
                updateViewerCount();
            });

            peer.on('connection', (conn) => {
                activeConnections.push(conn);
                peer.call(conn.peer, combinedStream);
                updateViewerCount();

                conn.on('data', (data) => {
                    if (data && (data.type === 'MOUSE_CLICK' || data.type === 'MOUSE_MOVE')) {
                        if (localWs && localWs.readyState === WebSocket.OPEN) {
                            localWs.send(JSON.stringify(data));
                        }
                    }
                });

                const removeConn = () => {
                    activeConnections = activeConnections.filter(c => c.peer !== conn.peer);
                    updateViewerCount();
                };

                conn.on('close', removeConn);
                conn.on('error', removeConn);
            });

            displayStream.getVideoTracks()[0].onended = () => {
                location.reload();
            };

        } catch (err) {
            console.error(err);
            statusElement.innerText = "Erro ao iniciar captura de tela.";
        }
    }

    function updateViewerCount() {
        const count = activeConnections.length;
        const text = count === 1 ? "1 pessoa assistindo" : `${count} pessoas assistindo`;
        viewerCountElement.innerText = text;

        activeConnections.forEach(conn => {
            try {
                conn.send({ type: 'VIEWER_COUNT', count: count });
            } catch (e) {}
        });
    }

    function connectToStream(hostId) {
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);

            conn.on('open', () => {
                statusElement.innerText = "Conectado ao transmissor. Clique na tela para enviar comandos de mouse!";
                setupMouseController(conn);
            });

            conn.on('data', (data) => {
                if (data && data.type === 'VIEWER_COUNT') {
                    const count = data.count;
                    const text = count === 1 ? "1 pessoa assistindo" : `${count} pessoas assistindo`;
                    viewerCountElement.innerText = text;
                }
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false;
                    videoElement.play().catch(() => {
                        statusElement.innerText = "Clique no botão verde '🔊 Ativar Som'.";
                    });
                });
            });
        });
    }

    // Captura os cliques diretamente na camada 'clickOverlay'
    function setupMouseController(conn) {
        // Clique com botão esquerdo
        clickOverlay.addEventListener('click', (event) => {
            sendMouseEvent(event, conn, 'left');
        });

        // Clique com botão direito
        clickOverlay.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            sendMouseEvent(event, conn, 'right');
        });
    }

    function sendMouseEvent(event, conn, buttonType) {
        const rect = clickOverlay.getBoundingClientRect();
        
        // Calcula a posição proporcional do clique em relação ao tamanho real do vídeo transmitido
        const scaleX = videoElement.videoWidth / rect.width;
        const scaleY = videoElement.videoHeight / rect.height;

        const realX = Math.round((event.clientX - rect.left) * scaleX);
        const realY = Math.round((event.clientY - rect.top) * scaleY);

        if (!isNaN(realX) && !isNaN(realY)) {
            conn.send({
                type: 'MOUSE_CLICK',
                x: realX,
                y: realY,
                button: buttonType
            });
        }
    }

    function enableAudio() {
        videoElement.muted = false;
        videoElement.volume = 1.0;
        videoElement.play();
        document.getElementById('unmute-btn').style.display = 'none';
        statusElement.innerText = "Áudio ativado com sucesso!";
    }

    function copyLink() {
        shareInput.select();
        document.execCommand('copy');
        alert("Link copiado com sucesso!");
    }

    function sendWhatsApp() {
        const phoneInput = document.getElementById('phone-number').value.replace(/\D/g, '');
        const shareLink = shareInput.value;

        if (!shareLink) {
            alert("Inicie a transmissão primeiro para gerar o link!");
            return;
        }

        const message = `Segue o link para a nossa conexão remota: ${shareLink}`;
        const encodedMessage = encodeURIComponent(message);

        let whatsappUrl = '';
        if (phoneInput) {
            whatsappUrl = `https://api.whatsapp.com/send?phone=55${phoneInput}&text=${encodedMessage}`;
        } else {
            whatsappUrl = `https://api.whatsapp.com/send?text=${encodedMessage}`;
        }

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
