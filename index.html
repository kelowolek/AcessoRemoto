<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Remoto Completo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 1000px;
            text-align: center;
            position: relative;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        h1 { font-size: 18px; color: #38bdf8; text-align: left; }

        .viewer-badge {
            background-color: #0284c7;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-mode-direct { background-color: #eab308 !important; color: #000 !important; }
        .btn-off { background-color: #64748b !important; }
        .btn-green { background-color: #10b981; }
        .btn-whatsapp { background-color: #25d366; }

        .video-container {
            position: relative;
            width: 100%;
            max-height: 80vh;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            user-select: none;
            -webkit-user-drag: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .fullscreen-active {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            background-color: #000 !important;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none; /* Impede que o vídeo intercepte ou seja arrastado */
            user-select: none;
            -webkit-user-drag: none;
        }
        
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Botão Flutuante (Canto Inferior Direito) */
        .floating-menu-btn {
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 99999;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            display: none;
            opacity: 0.8;
        }
        .floating-menu-btn:hover { opacity: 1; }

        .floating-toolbar {
            position: fixed;
            bottom: 45px;
            right: 12px;
            z-index: 99999;
            background: rgba(30, 41, 59, 0.95);
            padding: 8px;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #hidden-keyboard-input {
            position: absolute;
            opacity: 0;
            top: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
        }

        .share-container {
            margin-top: 12px;
            display: none;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
        }
        .share-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="tel"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 13px;
        }
        #share-link { width: 55%; }
        #phone-number { width: 180px; }
        .status { margin-top: 10px; font-size: 12px; color: #94a3b8; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card" id="main-card">
    <div class="header-container" id="header-box">
        <h1 id="title">Painel de Acesso Remoto</h1>
        <div class="viewer-badge" id="viewer-badge" style="display: none;">
            <span class="live-dot"></span>
            <span id="viewer-count">0 conexões</span>
        </div>
    </div>

    <div id="viewer-controls" class="toolbar" style="display: none;">
        <button id="toggle-mouse-btn" class="btn" onclick="toggleMouseControl()">🖱️ Modo: MOVIMENTO</button>
        <button id="toggle-audio-btn" class="btn" onclick="toggleAudio()">🔊 Áudio: ATIVO</button>
        <button id="open-keyboard-btn" class="btn btn-green" onclick="focusKeyboard()">⌨️ Teclado</button>
        <button id="fullscreen-btn" class="btn" onclick="toggleFullscreen()">🖥️ Tela Cheia</button>
    </div>

    <div id="host-controls">
        <button id="start-btn" class="btn btn-green" onclick="startBroadcasting()">🚀 Transmitir Minha Tela</button>
    </div>

    <div id="share-container" class="share-container">
        <div class="share-row">
            <input type="text" id="share-link" readonly>
            <button class="btn" onclick="copyLink()">Copiar Link</button>
        </div>
        <div class="share-row">
            <input type="tel" id="phone-number" placeholder="DDD + Número">
            <button class="btn btn-whatsapp" onclick="sendWhatsApp()">💬 WhatsApp</button>
        </div>
    </div>

    <div class="video-container" id="video-box">
        <video id="video-player" autoplay playsinline muted></video>
        <div id="click-overlay" class="click-overlay" style="display: none;"></div>
    </div>

    <!-- BOTÃO FLUTUANTE EM TELA CHEIA (CANTO INFERIOR DIREITO) -->
    <button class="floating-menu-btn" id="floating-btn" onclick="toggleFloatingMenu()">⚙️ Opções</button>
    <div class="floating-toolbar" id="floating-toolbar">
        <button class="btn" id="float-mouse-btn" onclick="toggleMouseControl()">🖱️ Modo: MOVIMENTO</button>
        <button class="btn" onclick="toggleAudio()">🔊 Alternar Áudio</button>
        <button class="btn btn-green" onclick="focusKeyboard()">⌨️ Abrir Teclado</button>
        <button class="btn btn-off" onclick="toggleFullscreen()">❌ Sair Tela Cheia</button>
    </div>

    <input type="text" id="hidden-keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">

    <div id="status" class="status">Aguardando ação...</div>
</div>

<script>
    let peer = null;
    let combinedStream = null;
    let activeConnections = [];
    let localWs = null;

    let isContinuousMouse = true;
    let isAudioEnabled = true;
    let isFullscreen = false;

    let isMouseDown = false;
    let touchHoldTimer = null;
    let singleTapTimer = null;
    let tapCount = 0;
    let isMultiTouch = false;

    const videoElement = document.getElementById('video-player');
    const videoBox = document.getElementById('video-box');
    const clickOverlay = document.getElementById('click-overlay');
    const hiddenInput = document.getElementById('hidden-keyboard-input');
    const statusElement = document.getElementById('status');
    const shareContainer = document.getElementById('share-container');
    const shareInput = document.getElementById('share-link');
    const hostControls = document.getElementById('host-controls');
    const viewerControls = document.getElementById('viewer-controls');
    const viewerBadge = document.getElementById('viewer-badge');
    const viewerCountElement = document.getElementById('viewer-count');
    const floatingBtn = document.getElementById('floating-btn');
    const floatingToolbar = document.getElementById('floating-toolbar');
    const headerBox = document.getElementById('header-box');

    const urlParams = new URLSearchParams(window.location.search);
    const streamIdParam = urlParams.get('stream');

    if (streamIdParam) {
        hostControls.style.display = 'none';
        viewerControls.style.display = 'flex';
        viewerBadge.style.display = 'inline-flex';
        clickOverlay.style.display = 'block';
        document.getElementById('title').innerText = "Sessão Remota Ativa";
        statusElement.innerText = "Conectando ao computador remoto...";
        connectToStream(streamIdParam);
    } else {
        connectLocalWebSocket();
    }

    function connectLocalWebSocket() {
        try {
            localWs = new WebSocket('ws://localhost:8080');
            localWs.onopen = () => {
                statusElement.innerText = "Pronto para transmitir (Programa local conectado).";
            };
            localWs.onerror = () => {
                statusElement.innerText = "Aviso: Programa app.js não detectado no PC.";
            };
        } catch (e) {}
    }

    async function startBroadcasting() {
        try {
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30, max: 60 } },
                audio: true
            });

            combinedStream = new MediaStream();
            displayStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

            if (displayStream.getAudioTracks().length > 0) {
                displayStream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
            }

            videoElement.srcObject = combinedStream;
            videoElement.muted = true;
            videoElement.play();

            peer = new Peer();

            peer.on('open', (id) => {
                const streamUrl = `${window.location.origin}${window.location.pathname}?stream=${id}`;
                shareInput.value = streamUrl;
                shareContainer.style.display = 'block';
                viewerBadge.style.display = 'inline-flex';
                document.getElementById('start-btn').disabled = true;
                updateViewerCount();
            });

            peer.on('connection', (conn) => {
                activeConnections.push(conn);
                peer.call(conn.peer, combinedStream);
                updateViewerCount();

                conn.on('data', (data) => {
                    if (data && localWs && localWs.readyState === WebSocket.OPEN) {
                        localWs.send(JSON.stringify(data));
                    }
                });

                const removeConn = () => {
                    activeConnections = activeConnections.filter(c => c.peer !== conn.peer);
                    updateViewerCount();
                };

                conn.on('close', removeConn);
                conn.on('error', removeConn);
            });

        } catch (err) {
            statusElement.innerText = "Erro ao iniciar captura de tela.";
        }
    }

    function updateViewerCount() {
        const count = activeConnections.length;
        viewerCountElement.innerText = count === 1 ? "1 conexão" : `${count} conexões`;
    }

    function connectToStream(hostId) {
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);

            conn.on('open', () => {
                statusElement.innerText = "Conectado! Controle o computador livremente.";
                setupControls(conn);
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false;
                    
                    const playPromise = videoElement.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            videoElement.muted = true;
                            videoElement.play();
                        });
                    }
                });
            });
        });
    }

    function setupControls(conn) {
        // --- PREVINE O ARRASTE PADRÃO DE IMAGEM/VÍDEO DO NAVEGADOR ---
        clickOverlay.addEventListener('dragstart', (e) => e.preventDefault());

        // --- ARRASTAR E SELECIONAR (DRAG & DROP REAL NO PC) ---
        clickOverlay.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (e.button === 0) {
                isMouseDown = true;
                const pos = getScaledCoordinates(e);
                conn.send({ type: 'MOUSE_DOWN', x: pos.x, y: pos.y, button: 'left' });
            }
        });

        clickOverlay.addEventListener('mousemove', (e) => {
            e.preventDefault();
            if (!isContinuousMouse && !isMouseDown) return;
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_MOVE', x: pos.x, y: pos.y });
        });

        clickOverlay.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (e.button === 0) {
                isMouseDown = false;
                const pos = getScaledCoordinates(e);
                conn.send({ type: 'MOUSE_UP', x: pos.x, y: pos.y, button: 'left' });
            }
        });

        clickOverlay.addEventListener('dblclick', (e) => {
            e.preventDefault();
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left', double: true });
        });

        clickOverlay.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const pos = getScaledCoordinates(e);
            conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'right', double: false });
        });

        // --- CONTROLE DE TOQUE (CELULAR) ---
        clickOverlay.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) {
                isMultiTouch = true;
                clearTimeout(touchHoldTimer);
                clearTimeout(singleTapTimer);
                return;
            }

            isMultiTouch = false;
            const touch = e.touches[0];
            const pos = getScaledCoordinates(touch);

            // Clique Direito ao segurar por 500ms
            touchHoldTimer = setTimeout(() => {
                if (!isMultiTouch) {
                    conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'right', double: false });
                }
            }, 500);
        });

        clickOverlay.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) {
                isMultiTouch = true;
                clearTimeout(touchHoldTimer);
                return;
            }

            if (isContinuousMouse && !isMultiTouch) {
                const touch = e.touches[0];
                const pos = getScaledCoordinates(touch);
                conn.send({ type: 'MOUSE_MOVE', x: pos.x, y: pos.y });
            }
        });

        clickOverlay.addEventListener('touchend', (e) => {
            clearTimeout(touchHoldTimer);
            if (isMultiTouch) return;

            const touch = e.changedTouches[0];
            const pos = getScaledCoordinates(touch);
            tapCount++;

            if (tapCount === 1) {
                singleTapTimer = setTimeout(() => {
                    conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left', double: false });
                    tapCount = 0;
                }, 220);
            } else if (tapCount === 2) {
                clearTimeout(singleTapTimer);
                conn.send({ type: 'MOUSE_CLICK', x: pos.x, y: pos.y, button: 'left', double: true });
                tapCount = 0;
            }
        });

        // --- CAPTURA AVANÇADA DE TECLADO E ATALHOS (Ctrl+A, Ctrl+C, Shift+Setas) ---
        hiddenInput.addEventListener('input', (e) => {
            if (e.data) {
                conn.send({ type: 'TEXT_INPUT', text: e.data });
            }
            hiddenInput.value = '';
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.id !== 'hidden-keyboard-input') return;

            // Previne atalhos locais do navegador (ex: Ctrl+A não seleciona o HTML local)
            if (e.ctrlKey || e.metaKey || (e.shiftKey && e.key.startsWith('Arrow'))) {
                e.preventDefault();
            }

            // Envia estado de pressão contínua para modificadoras
            if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) {
                conn.send({ type: 'KEY_TOGGLE', key: e.key, state: 'down' });
            }

            conn.send({
                type: 'KEY_PRESS',
                key: e.key,
                ctrlKey: e.ctrlKey,
                altKey: e.altKey,
                shiftKey: e.shiftKey,
                metaKey: e.metaKey
            });
        });

        window.addEventListener('keyup', (e) => {
            if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) {
                conn.send({ type: 'KEY_TOGGLE', key: e.key, state: 'up' });
            }
        });
    }

    function getScaledCoordinates(event) {
        const rect = videoElement.getBoundingClientRect();
        const scaleX = videoElement.videoWidth / rect.width;
        const scaleY = videoElement.videoHeight / rect.height;

        let x = Math.round((event.clientX - rect.left) * scaleX);
        let y = Math.round((event.clientY - rect.top) * scaleY);

        x = Math.max(0, Math.min(x, videoElement.videoWidth));
        y = Math.max(0, Math.min(y, videoElement.videoHeight));

        return { x, y };
    }

    function toggleMouseControl() {
        isContinuousMouse = !isContinuousMouse;
        const mainBtn = document.getElementById('toggle-mouse-btn');
        const floatBtn = document.getElementById('float-mouse-btn');

        if (isContinuousMouse) {
            mainBtn.classList.remove('btn-mode-direct');
            mainBtn.innerText = "🖱️ Modo: MOVIMENTO";
            if(floatBtn) floatBtn.innerText = "🖱️ Modo: MOVIMENTO";
        } else {
            mainBtn.classList.add('btn-mode-direct');
            mainBtn.innerText = "👆 Modo: TOQUE DIRETO";
            if(floatBtn) floatBtn.innerText = "👆 Modo: TOQUE DIRETO";
        }
    }

    function toggleFullscreen() {
        isFullscreen = !isFullscreen;
        if (isFullscreen) {
            videoBox.classList.add('fullscreen-active');
            floatingBtn.style.display = 'block';
            viewerControls.style.display = 'none';
            headerBox.style.display = 'none';
            statusElement.style.display = 'none';
        } else {
            videoBox.classList.remove('fullscreen-active');
            floatingBtn.style.display = 'none';
            floatingToolbar.style.display = 'none';
            viewerControls.style.display = 'flex';
            headerBox.style.display = 'flex';
            statusElement.style.display = 'block';
        }
    }

    function toggleFloatingMenu() {
        floatingToolbar.style.display = (floatingToolbar.style.display === 'flex') ? 'none' : 'flex';
    }

    function toggleAudio() {
        isAudioEnabled = !isAudioEnabled;
        videoElement.muted = !isAudioEnabled;
        const btn = document.getElementById('toggle-audio-btn');
        if (isAudioEnabled) {
            btn.classList.remove('btn-off');
            btn.innerText = "🔊 Áudio: ATIVO";
        } else {
            btn.classList.add('btn-off');
            btn.innerText = "🔇 Áudio: MUTADO";
        }
    }

    function focusKeyboard() {
        hiddenInput.focus();
        statusElement.innerText = "Teclado ativo! Pode digitar normalmente.";
    }

    function copyLink() {
        shareInput.select();
        document.execCommand('copy');
        alert("Link copiado!");
    }

    function sendWhatsApp() {
        const phone = document.getElementById('phone-number').value.replace(/\D/g, '');
        const url = shareInput.value;
        if (!url) return alert("Inicie a transmissão primeiro!");
        const msg = encodeURIComponent(`Link de acesso remoto: ${url}`);
        window.open(phone ? `https://api.whatsapp.com/send?phone=55${phone}&text=${msg}` : `https://api.whatsapp.com/send?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
